[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "company-search-backend"
version = "0.1.0"
description = "AI Company Search API"
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "fastapi",
    "pydantic-settings",
    "python-multipart",
    "sqlalchemy",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "pytest-cov",
    "respx",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not performance' --import-mode=importlib"
# Starlette 1.3.1 emits this only while its supported httpx fallback is in use.
filterwarnings = [
    'ignore:Using `httpx` with `starlette\.testclient` is deprecated; install `httpx2` instead\.\Z:starlette.exceptions.StarletteDeprecationWarning',
]
markers = [
    "performance: representative-dataset performance acceptance tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
